name: Windows packages

on:
  push:
    paths:
      - "windows/**"
      - "tests/windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            platform: x64
            runner: windows-2025-vs2026
          - arch: arm64
            platform: ARM64
            runner: windows-11-vs2026-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      ARCH: ${{ matrix.arch }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Check schedule compatibility, quota targets, and tray readings
        if: matrix.arch == 'x64'
        run: |
          dotnet run --project tests/windows/WindowsScheduleChecks.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the Windows app
        run: |
          $output = Join-Path $env:RUNNER_TEMP "CodexPace"
          dotnet publish windows/CodexPace.csproj -c Release -r "win-$env:ARCH" --self-contained true "-p:Platform=$env:PLATFORM" -o $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PACE_OUTPUT=$output" >> $env:GITHUB_ENV
      - name: Open the sample dashboard and check the tray card
        run: |
          $app = Start-Process (Join-Path $env:PACE_OUTPUT "CodexPace.exe") -ArgumentList "--demo" -WorkingDirectory $env:PACE_OUTPUT -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(45)
            do {
              Start-Sleep -Milliseconds 500
              $app.Refresh()
              if ($app.HasExited) { throw "Codex Pace exited before opening (code $($app.ExitCode))." }
            } until (($app.MainWindowHandle -ne 0 -and $app.Responding) -or (Get-Date) -ge $deadline)
            if ($app.MainWindowHandle -eq 0 -or -not $app.Responding) { throw "Codex Pace did not open a responsive window." }
            if ($env:ARCH -eq "x64") {
              Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class PaceTrayCheck {
              [DllImport("user32.dll", SetLastError = true)]
              public static extern bool PostMessageW(IntPtr handle, uint message, UIntPtr wParam, IntPtr lParam);
              [DllImport("user32.dll", CharSet = CharSet.Unicode, ExactSpelling = true)]
              public static extern IntPtr FindWindowW(string windowClass, string windowName);
              [DllImport("user32.dll")]
              public static extern uint GetWindowThreadProcessId(IntPtr handle, out uint processId);
              [DllImport("user32.dll")]
              public static extern bool IsWindowVisible(IntPtr handle);
          }
          '@
              $deadline = (Get-Date).AddSeconds(12)
              [uint32] $owner = 0
              do {
                $dashboard = [PaceTrayCheck]::FindWindowW([NullString]::Value, "Codex Pace")
                if ($dashboard -ne 0) {
                  [PaceTrayCheck]::GetWindowThreadProcessId($dashboard, [ref] $owner) | Out-Null
                } else { Start-Sleep -Milliseconds 250 }
              } until ($dashboard -ne 0 -or (Get-Date) -ge $deadline)
              if ($dashboard -eq 0 -or $owner -ne $app.Id) { throw "Couldn’t find the demo dashboard in process $($app.Id)." }
              # WM_APP + 1 is the shell callback. The high word identifies tray icon 1.
              if (-not [PaceTrayCheck]::PostMessageW($dashboard, 0x8001, [UIntPtr]::Zero, [IntPtr]0x00010400)) {
                $lastError = [System.Runtime.InteropServices.Marshal]::GetLastWin32Error()
                throw "Couldn’t activate the demo tray icon (Win32 error $lastError)."
              }
              $deadline = (Get-Date).AddSeconds(12)
              do {
                Start-Sleep -Milliseconds 250
                $card = [PaceTrayCheck]::FindWindowW([NullString]::Value, "Codex Pace quota")
              } until (($card -ne 0 -and [PaceTrayCheck]::IsWindowVisible($card)) -or (Get-Date) -ge $deadline)
              if ($card -eq 0 -or -not [PaceTrayCheck]::IsWindowVisible($card)) { throw "The tray quota card did not appear." }
              if (-not [PaceTrayCheck]::PostMessageW($dashboard, 0x8001, [UIntPtr]::Zero, [IntPtr]0x00010400)) {
                throw "Couldn’t close the demo tray card from the tray icon."
              }
              $deadline = (Get-Date).AddSeconds(12)
              do { Start-Sleep -Milliseconds 250 }
              until ((-not [PaceTrayCheck]::IsWindowVisible($card)) -or (Get-Date) -ge $deadline)
              if ([PaceTrayCheck]::IsWindowVisible($card)) { throw "The tray quota card did not close." }
              Write-Output "Verified that tray activation opens and closes the quota card."
              try {
                Add-Type -AssemblyName System.Drawing.Common
                Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class PacePreview {
              [StructLayout(LayoutKind.Sequential)]
              public struct Rect { public int Left, Top, Right, Bottom; }
              [DllImport("user32.dll")]
              public static extern bool GetWindowRect(IntPtr handle, out Rect rect);
              [DllImport("user32.dll")]
              public static extern bool SetForegroundWindow(IntPtr handle);
              [DllImport("user32.dll")]
              public static extern int GetSystemMetrics(int index);
              [DllImport("user32.dll")]
              public static extern bool MoveWindow(IntPtr handle, int x, int y, int width, int height, bool repaint);
          }
          '@
                $width = [Math]::Min(1000, [PacePreview]::GetSystemMetrics(0) - 32)
                $height = [Math]::Min(788, [PacePreview]::GetSystemMetrics(1) - 32)
                [PacePreview]::MoveWindow($app.MainWindowHandle, 16, 16, $width, $height, $true) | Out-Null
                [PacePreview]::SetForegroundWindow($app.MainWindowHandle) | Out-Null
                Start-Sleep -Seconds 1
                $rect = [PacePreview+Rect]::new()
                if (-not [PacePreview]::GetWindowRect($app.MainWindowHandle, [ref] $rect)) { throw "No window bounds." }
                $width = $rect.Right - $rect.Left
                $height = $rect.Bottom - $rect.Top
                if ($width -lt 300 -or $height -lt 200) { throw "Window too small for the preview." }
                $image = [System.Drawing.Bitmap]::new($width, $height)
                try {
                  $graphics = [System.Drawing.Graphics]::FromImage($image)
                  try { $graphics.CopyFromScreen($rect.Left, $rect.Top, 0, 0, $image.Size) }
                  finally { $graphics.Dispose() }
                  $image.Save((Join-Path $env:RUNNER_TEMP "Codex-Pace-Windows-Preview.png"), [System.Drawing.Imaging.ImageFormat]::Png)
                } finally { $image.Dispose() }
              } catch { Write-Warning "Preview capture was unavailable: $_" }
            }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id }
          }
      - name: Zip the app and its files
        run: |
          $archName = if ($env:ARCH -eq "arm64") { "arm64" } else { "x64" }
          $archive = Join-Path $env:RUNNER_TEMP "Codex-Pace-Windows-$archName.zip"
          tar.exe -a -cf $archive -C $env:PACE_OUTPUT .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PACE_ARCHIVE=$archive" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v6
        with:
          name: Windows-${{ matrix.arch }}
          path: ${{ env.PACE_ARCHIVE }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: matrix.arch == 'x64'
        with:
          name: Windows-preview
          path: ${{ runner.temp }}/Codex-Pace-Windows-Preview.png
          if-no-files-found: ignore
